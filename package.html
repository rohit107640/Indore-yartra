<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tour Package | Indore Yatra Tours & Travels</title>
  <meta name="description" content="Tour package details, day-by-day itinerary, inclusions and price.">
  <meta name="theme-color" content="#f97316">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Tour Package | Indore Yatra Tours & Travels">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://upload.wikimedia.org">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script>(function(){var d=document.documentElement;if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;d.classList.add("js-anim");try{if(sessionStorage.getItem("iy-transition")==="1")d.classList.add("is-entering")}catch(e){}setTimeout(function(){if(!window.__animReady)d.classList.remove("js-anim","is-entering")},3500)})();</script>
</head>
<body data-page="packages" data-header="overlay">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <!-- Filled in by js/packages.js from ?id= -->
    <section class="page-hero">
      <div class="hero__media"><img data-pkg-hero-img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" fetchpriority="high"></div>
      <div data-pkg-hero style="width:100%"></div>
    </section>

    <section class="section">
      <div class="container detail" data-pkg-detail>
        <div data-pkg-body></div>
        <aside class="book-card" id="book" data-book-card data-reveal="right">
          <p class="eyebrow mt-0">Book this trip</p>
          <div class="book-card__price"><strong data-book-price></strong><span>/ person</span></div>
          <p class="book-card__note">Final price depends on dates, hotel and group size.</p>
          <form data-enquiry data-variant="side" data-type="Tour Package" data-lock-type data-source="package-detail" aria-label="Package enquiry"></form>
        </aside>
      </div>
    </section>

    <section class="section section--cool">
      <div class="container">
        <div class="section-head section-head--split">
          <div>
            <p class="eyebrow" data-reveal>Keep exploring</p>
            <h2 data-reveal>You may also like</h2>
          </div>
          <a href="packages.html" class="btn btn--outline" data-reveal>All tours <i data-icon="arrow"></i></a>
        </div>
        <div class="pkg-grid" data-pkg-list data-related data-limit="3"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/data/photos.js" defer></script>
  <script src="assets/js/data/packages.js" defer></script>
  <script src="assets/js/data/cabs.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/packages.js" defer></script>
  <script src="assets/js/enquiry.js" defer></script>
  <script src="assets/js/datepicker.js" defer></script>
  <script src="assets/js/booking.js" defer></script>
  <script src="assets/js/calculator.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js" defer></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <script src="assets/js/animations.js" defer></script>
</body>
</html>
